<!DOCTYPE html>
<html>
    <head>
        <title>Creating Effects with CSS</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Imperial+Script&family=Oswald:wght@200..700&display=swap');
        </style>
    </head>
    <body>
        <!--NAVBAR-->
        <nav class="nav-bar">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li class="drop">
                    <a href="#">Images</a>
                    <div class="rollover-menu">
                        <a href="#image1">image 1</a>
                        <a href="#image2">image 2</a>
                        <a href="#image3">image 3</a>
                    </div>
                </li>
                </li>
            </ul>
        </nav>
        <!--IMAGES-->
        <section>
            <!--IMAGE ONE-->
            <div class="image-container" id="image1">
                <img src="images/japan-one.jpg" class="rotate">
            </div>
            <!--IMAGE TWO-->
            <div class="image-container" id="image2">
                <img src="images/japan-two.jpg"  class="zoom">
            </div>
            <!--IMAGE THREE-->
            <div class="image-container" id="image3">
                <div class="circle">
                <img src="images/japan-three.jpg">
                </div>
            </div>

        </section>
        <!--FOOTER-->
        <footer>
            <div class="footer-text">
                 <p>The Tech Acadamy &copy; </p>
            </div>
        </footer>

</html>
