<!DOCTYPE html>
<html>

<head>
    <title>One Page Site</title>
    <meta charset="UTF-8">
    <link href="css/one_page_website.css" rel="stylesheet">
</head>

<body>
    <!--NAVBAR-->
    <nav>
        <ul>
            <li><a href="#hoshi">Hoshi photo</a></li>
            <li><a href="#contact">CONTACT</a></li>
        </ul>
    </nav>
    <!--HOMEPAGE-->
    <header>
        <p>This is a website about Hoshi the cat!</p>
    </header>
    <!--HOSHI IMAGES-->
    <section>
        <div>
            <!--BEST HOSHI IMAGE-->
            <div id="hoshi">
                <h3>Hoshi is the best cat in the world!</h3>
                <img src="images/Hoshi.jpg" alt="Hoshi the cat">
            </div>
        </div>
    </section>
    <!--CONTACT-->
    <section>
        <div id="contact">
            <h3>Do you want to contact Hoshi?
                Leave your info here!
            </h3>
            <div>
                <form>
                    <label for="first">First Name</label>
                    <input id="first" type="text">

                    <label for="last">Last Name</label>
                    <input id="last" type="text">

                    <label for="email">Email</label>
                    <input id="email" type="email">

                    <label for="phone">Phone Number</label>
                    <input id="phone" type="tel">

                    <label for="message">Message</label>
                    <textarea id="message"></textarea>

                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </section>
    <!--HOSHI FAVORITE SONG-->
    <section>
        <div id="video">
            <h1>Hoshi's favorite music video!</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/SaA_cs4WZHM"
                title="The Kitty Cat Dance video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

    </section>
    <!--FOOTER-->
    <footer>
        <table>
            <tr>
                <td>
                    <p>I hope you like hoshi as much as I do!</p>
                </td>
            </tr>
        </table>
    </footer>
</body>

</html>
