<!DOCTYPE html>
<html>
    <head>
        <title>One Page Site</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <!--NAVBAR-->
        <nav>
            <ul>
                <li><a href="#hoshi">Hoshi photo</a></li>
                <li><a href="#contact">CONTACT</a></li>
    <!--HOMEPAGE-->
    <header>
        <p>This is a website about Hoshi the cat!</p>
    </header>
    <!--HOSHI IMAGES-->
    <section>
        <div>
            <!--BEST HOSHI IMAGE-->
            <div id="hoshi">
                <h3>Hoshi is the best cat in the world!</h3>
                <img src="images/Hoshi.jpg" alt="Hoshi the cat">
            </div>
        </div>
    </section>
    <!--CONTACT-->
    <section>
        <div id="contact">
            <h3>Do you want to contact Hoshi?
                Leave your info here!
            </h3>
            <div>
                <form>
                        <input type="text" placeholder="First Name">
                        <input type="text" placeholder="Last name"><br>
                        <input type="email" placeholder="Email"><br>
                        <input type="tel" placeholder="Phone Number"><br>
                        <textarea placeholder="Type your message here..."></textarea>
                        <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </section>
    <!--HOSHI FAVORITE SONG-->
    <section>
        <div id="video">
            <h1>Hoshi's favorite music video!</h1>
            <iframe width="1903" height="731" src="https://www.youtube.com/embed/SaA_cs4WZHM" title="The Kitty Cat Dance">
        </div>

    </section>
    <!--FOOTER-->
        <footer>
            <table>
                <tr>
                    <td>
                        <p>I hope you like hoshi as much as I do!</p>
                    </td>
                </tr>
            </table>
        </footer>
    </body>
</html>
